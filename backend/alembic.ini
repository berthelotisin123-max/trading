# BETZO Alembic configuration
[alembic]
# path to migration scripts
script_location = migrations

# timezone to use when printing the date
# within the log file.
# default: system timezone
# timezone = UTC

# maximum number of characters to render in the
# log file.
# default: 100
# max_length = 100

# template used to generate migration file names
# default: %%(rev)s_%%(slug)s
# file_template = %%(rev)s_%%(slug)s

# version code separator; default: ''
# version_code_separator =

# version location
# version_locations =

# the version table name
version_table = alembic_version

# the version column name
# version_column = version_num

# the version column type
# version_column_type = VARCHAR(32)

# the version table schema
# version_table_schema =

# the version table schema
# version_table_schema =

# whether to render all columns in the log file
# render_as_batch = false

# whether to render all columns in the log file
# render_item = None

# whether to render all columns in the log file
# literal_binds = false

# whether to render all columns in the log file
# dialect_opts =

# whether to render all columns in the log file
# compare_type = false

# whether to render all columns in the log file
# compare_server_default = false

# whether to render all columns in the log file
# include_schemas = false

# whether to render all columns in the log file
# include_object = None

# whether to render all columns in the log file
# process_revision_directives = None

# whether to render all columns in the log file
# revision_environment = None

# whether to render all columns in the log file
# output_buffer =

# sqlalchemy.url is set programmatically in env.py
sqlalchemy.url = %(database_url)s

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# details and examples

# format using "black" - use the console
# script = blackconsole:console_main
# for other configuration options, see:
# https://python-black.readthedocs.io/en/stable/usage_and_configuration/the_basics_of_configuration.html
# silence the console output
# quiet = true

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
